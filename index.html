<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دلتا - إدارة السكريبتات</title>
<style>
:root{--bg:#0b1220;--card:#111c33;--card2:#16233d;--text:#e8eefc;--muted:#9fb0cc;--line:#1f2d4a;--acc:#4cc9f0;--acc2:#b388ff;--ok:#3ddc97;--bad:#ff6b6b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;margin:0;padding:20px 14px}
.wrap{max-width:800px;margin:0 auto}
h2{color:var(--acc);margin-top:0}
h3{font-size:16px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:bold}
input[type=text],textarea{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#06101e;color:var(--text);font-family:monospace;font-size:14px;margin-top:6px}
textarea{min-height:150px;resize:vertical;direction:ltr;text-align:left}
.btn{padding:10px 16px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;font-size:14px;margin-left:5px;margin-bottom:5px}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#071019}
.btn.danger{background:rgba(255,107,107,.1);color:var(--bad);border:1px solid rgba(255,107,107,.3)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:6px}
.btn:active{transform:scale(.97)}
.link-out{width:100%;padding:10px;border-radius:6px;border:1px solid var(--line);background:#06101e;color:var(--ok);font-family:monospace;font-size:12px;direction:ltr;text-align:left;margin-top:5px}
.saved-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card2)}
.saved-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.saved-title{font-weight:bold;font-size:15px;color:var(--acc)}
.info{border-right:3px solid var(--acc);background:rgba(76,201,240,.1);padding:10px;border-radius:6px;font-size:13px;margin-bottom:15px}
</style>
</head>
<body>

<div class="wrap" id="mainUI">
  <h2>دلتا - إدارة السكريبتات</h2>
  
  <div class="info">
    <b>طريقة الاستخدام:</b><br>
    1. حط اسم السكريبت، وحط الكود بتاعك.<br>
    2. دوس "حفظ وإصدار رابط".<br>
    3. هتلاقي رابطين: واحد للمعاينة (صفحة بيضا)، وواحد للتشغيل (Raw) تحطه في الدلتا إكسكيوتور.
  </div>

  <!-- إنشاء سكريبت جديد -->
  <div class="card">
    <h3>إضافة سكريبت جديد</h3>
    <label>اسم السكريبت (للعرض بس)
      <input type="text" id="scriptName" placeholder="مثلاً: سكريبت طيران">
    </label>
    <label>كود السكريبت (Lua)
      <textarea id="scriptCode" placeholder="-- الزق الكود هنا" spellcheck="false"></textarea>
    </label>
    <button class="btn primary" id="saveBtn">💾 حفظ وإصدار رابط</button>
    <button class="btn danger" id="clearBtn">مسح الخانات</button>
    <div id="resultBox" style="margin-top:15px"></div>
  </div>

  <!-- السكريبتات المحفوظة -->
  <div class="card">
    <h3>السكريبتات المحفوظة (على جهازك)</h3>
    <div id="savedList"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const store={
  get:()=>JSON.parse(localStorage.getItem('delta_scripts')||'[]'),
  set:(data)=>localStorage.setItem('delta_scripts',JSON.stringify(data))
};

// دالة ترميز النص لـ Base64 (عشان الرابط)
function encodeBase64(str){return btoa(unescape(encodeURIComponent(str)))}
function decodeBase64(b64){return decodeURIComponent(escape(atob(b64)))}

// 1. فحص لو الرابط جاي عشان يعرض السكريبت بس (وضع الصفحة البيضا)
if(window.location.hash.startsWith('#view=')){
  const code = decodeBase64(window.location.hash.replace('#view=',''));
  document.body.innerHTML = '<pre style="direction:ltr;text-align:left;font-family:monospace;font-size:14px;padding:20px;margin:0;color:#fff;white-space:pre-wrap;">' + 
    code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + 
    '</pre>';
  document.body.style.background = '#000';
} else {
  // 2. الكود العادي بتاع إدارة السكريبتات
  renderList();

  $('#saveBtn').onclick = async () => {
    const name = $('#scriptName').value.trim() || 'سكريبت بدون اسم';
    const code = $('#scriptCode').value;
    
    if(!code.trim()){ alert('حط الكود الأول!'); return; }

    const resultBox = $('#resultBox');
    resultBox.innerHTML = `<div style="color:var(--acc)">⏳ جاري الرفع وتوليد الروابط...</div>`;

    // الرابط الأول: صفحة بيضا على موقعنا
    const viewLink = window.location.origin + window.location.pathname + '#view=' + encodeBase64(code);

    try {
      // الرابط الثاني: رابط Raw حقيقي للتشغيل في روبلوكس (بنستخدم Hastebin)
      const response = await fetch('https://hastebin.com/documents', {
        method: 'POST',
        body: code
      });
      const data = await response.json();
      const rawLink = `https://hastebin.com/raw/${data.key}`;
      
      // حفظ في الذاكرة
      const scripts = store.get();
      scripts.unshift({ id: Date.now(), name, code, viewLink, rawLink });
      store.set(scripts);
      
      // عرض النتيجة
      resultBox.innerHTML = `
        <div class="card" style="border-color:var(--ok)">
          <h4 style="color:var(--ok);margin-top:0">✅ تم الحفظ بنجاح</h4>
          
          <label>1. رابط المعاينة (صفحة بيضا):
            <input type="text" class="link-out" value="${viewLink}" readonly onclick="this.select()">
          </label>
          
          <label>2. رابط التشغيل (حطه في الدلتا):
            <input type="text" class="link-out" value="${rawLink}" readonly onclick="this.select()">
          </label>
          <div style="font-size:12px;color:var(--muted);margin-top:5px">الأمر: loadstring(game:HttpGet("${rawLink}"))()</div>
        </div>
      `;
      
      $('#scriptName').value = '';
      $('#scriptCode').value = '';
      renderList();
      
    } catch (error) {
      resultBox.innerHTML = `<div style="color:var(--bad)">❌ فشل الرفع. جرب تاني أو استخدم الرابط الأول.</div>`;
    }
  };

  $('#clearBtn').onclick = () => {
    $('#scriptName').value = '';
    $('#scriptCode').value = '';
    $('#resultBox').innerHTML = '';
  };

  // عرض السكريبتات المحفوظة
  function renderList(){
    const list = store.get();
    const box = $('#savedList');
    if(!list.length){ box.innerHTML = '<p style="color:var(--muted);font-size:13px">مفيش سكريبتات محفوظة لسه.</p>'; return; }
    
    box.innerHTML = list.map((s, i) => `
      <div class="saved-item">
        <div class="saved-header">
          <span class="saved-title">${s.name}</span>
          <div>
            <button class="btn sm danger" onclick="deleteScript(${i})">حذف</button>
          </div>
        </div>
        <label>رابط المعاينة: <input type="text" class="link-out" value="${s.viewLink}" readonly onclick="this.select()"></label>
        <label>رابط التشغيل: <input type="text" class="link-out" value="${s.rawLink}" readonly onclick="this.select()"></label>
        <button class="btn sm primary" style="margin-top:10px" onclick="editScript(${i})">تعديل الكود</button>
      </div>
    `).join('');
  }

  window.deleteScript = (index) => {
    if(confirm('متأكد إنك عايز تمسح السكريبت ده؟')){
      const list = store.get();
      list.splice(index, 1);
      store.set(list);
      renderList();
    }
  };

  window.editScript = (index) => {
    const list = store.get();
    const script = list[index];
    $('#scriptName').value = script.name;
    $('#scriptCode').value = script.code;
    // مسح السكريبت القديم عشان تحفظه من جديد
    list.splice(index, 1);
    store.set(list);
    renderList();
    window.scrollTo({top:0, behavior:'smooth'});
  };
}
</script>
</body>
</html>
