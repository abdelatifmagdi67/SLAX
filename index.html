<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دلتا - إدارة السكريبتات</title>
<style>
:root{--bg:#0b1220;--card:#111c33;--card2:#16233d;--text:#e8eefc;--muted:#9fb0cc;--line:#1f2d4a;--acc:#4cc9f0;--acc2:#b388ff;--ok:#3ddc97;--bad:#ff6b6b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;margin:0;padding:20px 14px}
.wrap{max-width:800px;margin:0 auto}
h2{color:var(--acc);margin-top:0}
h3{font-size:16px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:bold}
input[type=text],textarea{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#06101e;color:var(--text);font-family:monospace;font-size:14px;margin-top:6px}
textarea{min-height:150px;resize:vertical;direction:ltr;text-align:left}
.btn{padding:10px 16px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;font-size:14px;margin-left:5px;margin-bottom:5px;display:inline-block;text-decoration:none;transition:0.2s}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#071019}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:6px}
.btn:active{transform:scale(.97)}
.btn.danger { background: rgba(255,107,107,0.1); color: var(--bad); border: 1px solid rgba(255,107,107,0.3); user-select: none; -webkit-user-select: none; }
.btn.danger.holding { background: var(--bad); color: white; }
.link-out{width:100%;padding:10px;border-radius:6px;border:1px solid var(--line);background:#06101e;color:var(--ok);font-family:monospace;font-size:12px;direction:ltr;text-align:left;margin-top:5px}
.saved-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card2)}
.saved-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:10px}
.saved-title{font-weight:bold;font-size:15px;color:var(--acc)}
.info{border-right:3px solid var(--acc);background:rgba(76,201,240,.1);padding:10px;border-radius:6px;font-size:13px;margin-bottom:15px}

/* شاشة التعديل البيضا */
#editScreen {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #ffffff; z-index: 9999; padding: 20px; box-sizing: border-box;
  flex-direction: column;
}
#editScreen.active { display: flex; }
#editScreen h2 { color: #000; margin-top: 0; margin-bottom: 15px; }
#editScreen textarea {
  flex: 1; width: 100%; background: #ffffff; color: #000000;
  border: 2px solid #ccc; border-radius: 8px; padding: 15px;
  font-family: monospace; font-size: 15px; line-height: 1.5;
  direction: ltr; text-align: left; resize: none; margin-bottom: 15px;
}
#editScreen .btn-save-edit {
  background: #000; color: #fff; padding: 15px; border: none;
  border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
  margin-bottom: 10px;
}
#editScreen .btn-cancel-edit {
  background: #eee; color: #000; padding: 15px; border: none;
  border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
}
</style>
</head>
<body>

<div class="wrap" id="mainUI">
  <h2>دلتا - إدارة السكريبتات</h2>
  
  <div class="card">
    <h3>إضافة سكريبت جديد</h3>
    <label>اسم السكريبت
      <input type="text" id="scriptName" placeholder="مثلاً: سكريبت طيران">
    </label>
    <label>كود السكريبت (Lua)
      <textarea id="scriptCode" placeholder="-- الزق الكود هنا" spellcheck="false"></textarea>
    </label>
    <button class="btn primary" id="saveBtn" style="width:100%; padding:12px;">💾 حفظ وإصدار رابط</button>
    <div id="resultBox" style="margin-top:15px"></div>
  </div>

  <div class="card">
    <h3>السكريبتات المحفوظة</h3>
    <div id="savedList"></div>
  </div>
</div>

<div id="editScreen">
  <h2 id="editTitle">تعديل السكريبت</h2>
  <textarea id="editTextarea" spellcheck="false"></textarea>
  <button class="btn-save-edit" id="saveEditBtn" onclick="saveEditedScript()">حفظ التعديلات (هيطلع رابط جديد)</button>
  <button class="btn-cancel-edit" onclick="closeEditScreen()">إلغاء والرجوع</button>
</div>

<script>
const $=s=>document.querySelector(s);
const store={
  get:()=>JSON.parse(localStorage.getItem('delta_scripts')||'[]'),
  set:(data)=>localStorage.setItem('delta_scripts',JSON.stringify(data))
};

// دالة رفع الكود على سيرفر نصوص (pastes.dev سيرفر قوي وموثوق)
async function uploadToRaw(text) {
  const res = await fetch('https://api.pastes.dev/post', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: text
  });
  
  if (!res.ok) throw new Error('السيرفر رفض الاستلام');
  
  const data = await res.json();
  // الرابط الخام بيبقى شكله كده: https://api.pastes.dev/xxxx
  return 'https://api.pastes.dev/' + data.key; 
}

let editingIndex = -1;

function renderList(){
  const list = store.get();
  const box = $('#savedList');
  if(!list.length){ box.innerHTML = '<p style="color:var(--muted);font-size:13px">مفيش سكريبتات محفوظة لسه.</p>'; return; }
  
  box.innerHTML = list.map((s, i) => `
    <div class="saved-item">
      <div class="saved-header">
        <span class="saved-title">${s.name}</span>
        <div style="display:flex; gap:5px;">
          <button class="btn primary sm" onclick="openEditScreen(${i})">✏️ تعديل</button>
          <button class="btn danger sm" id="delBtn_${i}" 
            onmousedown="startDel(${i})" onmouseup="cancelDel(${i})" onmouseleave="cancelDel(${i})"
            ontouchstart="startDel(${i})" ontouchend="cancelDel(${i})">❌ امسك للمسح</button>
        </div>
      </div>
      
      <label style="margin-top:10px;">الرابط الخام (الصفحة البيضا):
        <input type="text" class="link-out" value="${s.rawLink}" readonly onclick="this.select()">
        <a href="${s.rawLink}" target="_blank" class="btn sm primary" style="display:inline-block;margin-top:5px;width:100%;text-align:center;">🔗 افتح الرابط</a>
      </label>
      
      <div style="font-size:12px;color:var(--ok);margin-top:10px;direction:ltr;text-align:left;background:#000;padding:10px;border-radius:5px;">
        loadstring(game:HttpGet("${s.rawLink}"))()
      </div>
    </div>
  `).join('');
}

$('#saveBtn').onclick = async () => {
  const name = $('#scriptName').value.trim() || 'سكريبت بدون اسم';
  const code = $('#scriptCode').value;
  if(!code.trim()){ alert('حط الكود الأول!'); return; }

  const resultBox = $('#resultBox');
  resultBox.innerHTML = `<div style="color:var(--acc)">⏳ جاري الرفع (استنى ثانية)...</div>`;

  try {
    const rawLink = await uploadToRaw(code);
    const scripts = store.get();
    scripts.unshift({ id: Date.now(), name, code, rawLink });
    store.set(scripts);
    
    resultBox.innerHTML = `<div class="card" style="border-color:var(--ok)"><h4 style="color:var(--ok);margin-top:0">✅ تم الحفظ! تحت هتلاقي الرابط.</h4></div>`;
    $('#scriptName').value = '';
    $('#scriptCode').value = '';
    renderList();
  } catch (error) {
    resultBox.innerHTML = `<div style="color:var(--bad)">❌ فشل الرفع. جرب تغلق الـ VPN لو شغال وتاني.</div>`;
  }
};

window.openEditScreen = (index) => {
  const list = store.get();
  editingIndex = index;
  $('#editTitle').textContent = 'تعديل: ' + list[index].name;
  $('#editTextarea').value = list[index].code;
  $('#editScreen').classList.add('active');
};

window.closeEditScreen = () => {
  $('#editScreen').classList.remove('active');
  editingIndex = -1;
};

window.saveEditedScript = async () => {
  if(editingIndex === -1) return;
  const newCode = $('#editTextarea').value;
  if(!newCode.trim()){ alert('الكود فاضي!'); return; }

  const btn = $('#saveEditBtn');
  btn.textContent = 'جاري الحفظ...';
  btn.disabled = true;

  try {
    const rawLink = await uploadToRaw(newCode);
    const list = store.get();
    list[editingIndex].code = newCode;
    list[editingIndex].rawLink = rawLink; 
    store.set(list);
    
    closeEditScreen();
    renderList();
  } catch (error) {
    alert('فشل حفظ التعديل. جرب تغلق الـ VPN.');
  } finally {
    btn.textContent = 'حفظ التعديلات (هيطلع رابط جديد)';
    btn.disabled = false;
  }
};

// نظام الحذف (اضغط مطول)
let delTimer = null;
window.startDel = (index) => {
  const btn = document.getElementById(`delBtn_${index}`);
  btn.classList.add('holding');
  btn.textContent = '❌ استنى...';
  delTimer = setTimeout(() => {
    if(confirm('متأكد إنك عايز تمسح السكريبت ده نهائياً؟')){
      const list = store.get();
      list.splice(index, 1);
      store.set(list);
      renderList();
    } else {
      btn.classList.remove('holding');
      btn.textContent = '❌ امسك للمسح';
    }
  }, 1000); 
};
window.cancelDel = (index) => {
  clearTimeout(delTimer);
  const btn = document.getElementById(`delBtn_${index}`);
  if(btn) {
    btn.classList.remove('holding');
    btn.textContent = '❌ امسك للمسح';
  }
};

renderList();
</script>
</body>
</html>
